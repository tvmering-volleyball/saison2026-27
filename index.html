<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Mering Volleyball – Saison 2026/27</title>
<!--
  BEARBEITEN: Alles Anpassbare steht im <script id="daten"> weiter unten.
  TEAMS: Name + Farbe je Mannschaft (Kürzel D/H1/H2 nicht ändern).
  SPIELTAGE: datum "JJJJ-MM-TT", team, zeit "HH:MM", ausrichter, spiele [Gegner].
    Beginnt ausrichter mit "TV Mering", wird der Tag als Heimspiel markiert.
  Vergangene Spieltage (Datum vor heute) rutschen automatisch in den
  Abschnitt "Vergangene Spieltage" am Ende.
  STAND: Datum im Footer überschreiben.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
  :root{
    --ink:#17202e; --ink-soft:#5a6473; --bg:#f5f7fa; --surface:#fff;
    --line:#e4e8ef; --line-strong:#cfd6e0; --radius:12px; --maxw:960px;
    --hero:#17202e;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f6; --ink-soft:#a3adbc; --bg:#11151c; --surface:#181d26;
      --line:#2a323f; --line-strong:#3a4453; --hero:#0b0e13;
    }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:clamp(16px,4vw,36px) clamp(16px,4vw,28px) 64px;}

  header.hero{margin-bottom:22px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .hero img{order:2;flex:none;height:clamp(50px,calc(26px + 4.9vw),65px);width:auto;display:block;}
  .hero .txt{min-width:0;}
  .club{font-family:'Space Grotesk',sans-serif;font-weight:500;letter-spacing:.14em;font-size:.82rem;color:var(--ink-soft);margin:0 0 6px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.9rem,6vw,3rem);line-height:1.02;margin:0;letter-spacing:-.01em;}
  .season{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(1.05rem,3.2vw,1.35rem);color:var(--ink-soft);margin:6px 0 0;}

  .controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
    padding:14px 0 12px;margin-top:18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .filter{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    font:inherit;font-size:.9rem;font-weight:500;padding:7px 13px 7px 11px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:opacity .15s,border-color .15s;}
  .filter .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;}
  .filter[aria-pressed="false"]{opacity:.4;}
  .filter:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .toggle{margin-left:auto;}

  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.15rem;
    margin:38px 0 0;padding-top:14px;border-top:2px solid var(--line-strong);color:var(--ink-soft);}
  #tabellen{scroll-margin-top:72px;}
  .week:last-of-type{border-bottom:none;}
  .past{opacity:.62;}

  .week{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--line);}
  .week__dow{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.02rem;display:block;}
  .week__dmy{color:var(--ink-soft);font-size:.92rem;font-variant-numeric:tabular-nums;}
  .week__matches{display:flex;flex-direction:column;gap:12px;min-width:0;}

  .match{--team:var(--line-strong);background:var(--surface);border:1px solid var(--line);
    border-left:5px solid var(--team);border-radius:var(--radius);padding:14px 16px;display:grid;gap:4px 16px;grid-template-columns:auto 1fr;}
  .match__top{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .chip{background:var(--team);color:var(--chip-fg,#17202e);font-weight:600;font-size:.82rem;padding:3px 11px;border-radius:999px;white-space:nowrap;}
  .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;}
  .heim{font-size:.72rem;font-weight:600;letter-spacing:.03em;border:1px solid var(--line-strong);padding:2px 8px;border-radius:999px;}
  .games{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;margin:0;padding:0;}
  .games li{list-style:none;font-size:1.02rem;}
  .games .vs{color:var(--ink-soft);font-size:.86rem;margin-right:6px;}
  .host{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:.86rem;color:var(--ink-soft);}
  .host b{color:var(--ink);font-weight:600;}
  .empty{padding:40px 0;color:var(--ink-soft);text-align:center;}
  .tabellen h3{font-size:1.05rem;margin:22px 0 8px;font-family:'Space Grotesk',sans-serif;}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;}
  .thead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px;}
  .thead h3{margin:0;}
  .tickrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:16px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .tickrow .lbl{font-weight:600;font-size:.9rem;color:#fff;}
  .tickrow .tick{font-size:.72rem;padding:4px 10px;}
  .tickrow .down{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:1.2rem;line-height:1;padding:2px 6px;}
  .tickrow .down .dl{font-size:.72rem;font-weight:600;}
  .tick{background:var(--c);color:#17202e;font-weight:600;font-size:.85rem;padding:6px 12px;border-radius:999px;text-decoration:none;white-space:nowrap;}
  .tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .tabellen iframe{width:100%;height:700px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;}
  footer{margin-top:34px;font-size:.82rem;color:var(--ink-soft);line-height:1.7;}
  footer a{color:inherit;}
  @media (max-width:600px){
    .week{grid-template-columns:1fr;gap:10px;padding:18px 0;}
    .week__date{display:flex;align-items:baseline;gap:8px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}html{scroll-behavior:auto;}}
</style>
</head>

</script>

<script>
  const plan = document.getElementById('plan');
  const controls = document.getElementById('controls');
  const heimOnly = document.getElementById('heimOnly');
  const aktiv = {};

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const istHeim = st => /^tv mering/i.test(st.ausrichter.trim());
  const chipFg = hex => {
    const h = hex.replace('#','');
    const c = [0,2,4].map(i => parseInt(h.substr(i,2),16)/255);
    const lin = v => v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4);
    const L = .2126*lin(c[0]) + .7152*lin(c[1]) + .0722*lin(c[2]);
    return ((L+.05)/.05) >= (1.05/(L+.05)) ? '#17202e' : '#ffffff';
  };
  const dObj = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
  const fmtDow = d => d.toLocaleDateString('de-DE', { weekday:'long' });
  const fmtDmy = d => d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' });
  const heute = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();

  Object.entries(TEAMS).forEach(([key, t]) => {
    aktiv[key] = true;
    const b = document.createElement('button');
    b.className = 'filter'; b.type = 'button';
    b.setAttribute('aria-pressed', 'true');
    b.style.setProperty('--c', t.color);
    b.innerHTML = `<span class="dot"></span>${esc(t.name)}`;
    b.addEventListener('click', () => {
      aktiv[key] = !aktiv[key];
      b.setAttribute('aria-pressed', String(aktiv[key]));
      render();
    });
    controls.insertBefore(b, controls.querySelector('.toggle'));
  });
  heimOnly.addEventListener('change', render);

  const karte = st => {
    const t = TEAMS[st.team];
    const gegner = st.spiele.map((g,i) => `<li><span class="vs">Spiel ${i+1}</span>${esc(g)}</li>`).join('');
    return `
      <article class="match" style="--team:${t.color};--chip-fg:${chipFg(t.color)}">
        <div class="match__top">
          <span class="chip">${esc(t.name)}</span>
          <span class="time">${esc(st.zeit)} Uhr</span>
          ${istHeim(st) ? '<span class="heim">Heimspiel</span>' : ''}
        </div>
        <ul class="games">${gegner}</ul>
        <div class="host">Ausrichter: <b>${esc(st.ausrichter)}</b></div>
      </article>`;
  };

  const gruppiere = liste => {
    const g = {};
    for (const st of liste) (g[st.datum] ||= []).push(st);
    return Object.entries(g).map(([iso, tage]) => {
      const d = dObj(iso);
      return `
        <section class="week">
          <div class="week__date">
            <span class="week__dow">${fmtDow(d)}</span>
            <span class="week__dmy">${fmtDmy(d)}</span>
          </div>
          <div class="week__matches">${tage.map(karte).join('')}</div>
        </section>`;
    }).join('');
  };

  function render(){
    const sichtbar = SPIELTAGE.filter(st => aktiv[st.team] && (!heimOnly.checked || istHeim(st)))
      .sort((a,b) => a.datum.localeCompare(b.datum) || a.zeit.localeCompare(b.zeit));

    if (!sichtbar.length){
      plan.innerHTML = '<p class="empty">Keine Spieltage für die aktuelle Auswahl.</p>';
      return;
    }
    const kommend = sichtbar.filter(st => dObj(st.datum) >= heute);
    const vorbei  = sichtbar.filter(st => dObj(st.datum) <  heute);

    let html = '';
    if (kommend.length) html += gruppiere(kommend);
    else html += '<p class="empty">Keine anstehenden Spieltage für die aktuelle Auswahl.</p>';
    if (vorbei.length)
      html += `<h2 class="section-title">Vergangene Spieltage</h2><div class="past">${gruppiere(vorbei)}</div>`;
    plan.innerHTML = html;
  }
  render();
</script>
</body>
